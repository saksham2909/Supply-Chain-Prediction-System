<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supply Chain Delay Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Supply Chain Delay Prediction</h1>

        <form id="predictionForm">

            <div class="form-grid">

                {% for feature in features %}

                <div class="field">

                    <label>{{ feature }}</label>

                    {% if feature in encoders %}

                    <select name="{{ feature }}" required>
                        <option value="">Select {{ feature }}</option>

                        {% for value in encoders[feature].classes_ %}
                        <option value="{{ value }}">{{ value }}</option>
                        {% endfor %}

                    </select>

                    {% else %}

                    <input type="number" step="any" name="{{ feature }}" placeholder="Enter {{ feature }}" required>

                    {% endif %}

                </div>

                {% endfor %}

            </div>

            <button type="submit">
                Predict Delivery Risk
            </button>

        </form>

        <div id="result"></div>

    </div>


    <script>
        document.getElementById("predictionForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const formData = new FormData(this);

            const response = await fetch("/predict", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            const resultBox = document.getElementById("result");

            if (!response.ok) {
                resultBox.innerHTML = "Error: " + result.error;
                return;
            }

            resultBox.innerHTML =
                "Prediction: " + result.prediction +
                "<br>Risk: " + result.risk_percentage + "%";
        });
    </script>

</body>

</html>
